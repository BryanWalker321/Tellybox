name: Test Tellybox
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 22
          - os: ubuntu-24.04
            node: 24
          - os: ubuntu-24.04-arm
            node: 22
          - os: ubuntu-26.04
            node: 22
            broadcastOnly: true
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install provider test dependencies
        run: python -m pip install "yt-dlp[default]" curl-cffi
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --yes --no-progress
          $encoder = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg\tools -Filter ffmpeg.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName
          $probe = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg\tools -Filter ffprobe.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (!$encoder -or !$probe) { throw 'FFmpeg installation is incomplete' }
          "FFMPEG_PATH=$encoder" >> $env:GITHUB_ENV
          "FFPROBE_PATH=$probe" >> $env:GITHUB_ENV
          Split-Path $encoder | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # Full suite uses the supported LTS dependency baseline. Newer FFmpeg
      # separately exercises the actual continuous engine shipped by the server.
      - run: npm test
        if: ${{ !matrix.broadcastOnly }}
      - name: Check current broadcast engine with modern FFmpeg
        if: ${{ matrix.broadcastOnly }}
        run: node --test --test-concurrency=2 test/advert-fallback.test.mjs test/continuous-countdown.test.mjs test/continuous-relay.test.mjs test/programme-tail-handoff.test.mjs test/programme-search.test.mjs test/server.test.mjs
      - run: npm run validate
      - name: Build native Docker image
        if: runner.os == 'Linux' && matrix.node == 22 && !matrix.broadcastOnly
        run: docker build -t tellybox-smoke .
      - name: Check container startup and live playback
        if: runner.os == 'Linux' && matrix.node == 22 && !matrix.broadcastOnly
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name tellybox-smoke -p 127.0.0.1:4173:4173 tellybox-smoke
          trap 'docker rm -f tellybox-smoke >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/api/catalogue >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/channels.m3u >/dev/null
          curl -fsS http://127.0.0.1:4173/guide.xml >/dev/null
          timeout 90 ffmpeg -v error -rw_timeout 30000000 -i http://127.0.0.1:4173/iptv/demo/index.m3u8 -t 24 -f null -
