<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tellytext</title><link rel="stylesheet" href="/teletext.css"><link rel="stylesheet" href="/teletext-standalone.css"><script type="module" src="/teletext-standalone.mjs"></script></head>
<body><main id="teletext-view"><div id="teletext" class="teletext tt-standalone"><div class="tt-surface"><div class="teletext-header"><span id="tt-page">P100</span><span id="tt-brand">TELLYTEXT</span><span id="tt-clock"></span></div><div id="tt-content" role="region" aria-label="Teletext page"><p>Loading Teletext...</p></div><div class="teletext-nav"><button type="button">Index</button><button type="button">TV now</button><button type="button">TV next</button><button type="button" id="tt-auto">Auto: off</button></div><div class="tt-controls"><button type="button" id="tt-fullscreen" aria-pressed="false">Fullscreen</button><label>Page number<input id="tt-input" type="text" inputmode="numeric" maxlength="3" aria-label="Teletext page number" placeholder="100"></label><div class="tt-subpages"><button type="button" id="tt-previous" aria-label="Previous Teletext subpage">&lt;</button><span id="tt-subpage" aria-live="polite">1/1</span><button type="button" id="tt-next" aria-label="Next Teletext subpage">&gt;</button></div></div><p class="tt-help">0-9: page. R/G/Y/B or F1-F4: colours. Green/yellow: previous/next. F: fullscreen.</p></div></div></main></body></html>
